name: Ujian PDF (manual)
on:
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang
        run: |
          npm install --no-audit --no-fund --no-save pdfjs-dist@3.11.174 html2pdf.js@0.10.2 playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Bina laman
        run: |
          sh build.sh
          sed -i 's/apiKey: "AIza[^"]*"/apiKey: ""/' _site/index.html _site/penyewa.html
      - name: Uji tukar PDF kepada gambar
        run: |
          (cd _site && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          node .github/smoke-pdf.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-smoke
          path: out.jpg
