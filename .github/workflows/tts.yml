name: TTS narration
on:
  push:
    branches: [tts]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install edge-tts
      - name: Generate
        run: |
          python - <<'PY'
          import json, asyncio, edge_tts, os
          os.makedirs('mp3', exist_ok=True)
          lines = json.load(open('lines.json'))
          async def one(x):
              for v in ('ms-MY-YasminNeural',):
                  for a in range(4):
                      try:
                          await edge_tts.Communicate(x['text'], v, rate='+6%').save(f"mp3/{x['id']}.mp3"); return
                      except Exception as e:
                          print('retry', x['id'], e); await asyncio.sleep(3)
          async def main():
              for x in lines: await one(x)
          asyncio.run(main())
          print(len(os.listdir('mp3')), 'files')
          PY
      - name: Commit mp3
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add mp3 && git commit -m "mp3" && git push
